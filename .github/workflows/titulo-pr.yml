name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  titulo-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Conventional Commits; o âmbito é opcional e o assunto não tem regra de maiúsculas.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            perf
            build
            style
            revert
          subjectPattern: ^.+$
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
