# Checks de cada PR (#18). Os nomes dos jobs são estáveis: o ruleset do #24 refere-os.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Base explícita do --affected do turbo (comparação determinística com a main).
env:
  TURBO_SCM_BASE: origin/main

jobs:
  lint-tipos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm lint
      - run: pnpm exec turbo run typecheck --affected

  unitarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm exec turbo run test --affected -- --coverage
      - run: node packages/ci/src/lcov-cli.ts collect unit coverage/unitarios.info
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-unitarios
          path: coverage/unitarios.info
          if-no-files-found: ignore

  integracao:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm exec turbo run test:integration --affected -- --coverage
      - run: node packages/ci/src/lcov-cli.ts collect integration coverage/integracao.info
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-integracao
          path: coverage/integracao.info
          if-no-files-found: ignore

  seguranca:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - name: Avisar se ainda não há testes de segurança
        run: |
          if [ -z "$(git ls-files '*.seguranca.test.ts')" ]; then
            echo 'Ainda não há testes de segurança.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Sempre, sem --affected. O lcov de segurança traz todos os ficheiros contados a 0%, de
      # propósito: assim o diff-cover vê os ficheiros sem testes de todos os pacotes, mesmo
      # quando o --affected saltou os testes unitários e de integração desse pacote.
      # O --coverage.enabled mantém o reportsDirectory do script.
      - run: pnpm test:seguranca -- --coverage.enabled
      - run: node packages/ci/src/lcov-cli.ts collect seguranca coverage/seguranca.info
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-seguranca
          path: coverage/seguranca.info
          if-no-files-found: ignore

  cobertura:
    needs: [unitarios, integracao, seguranca]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lcov-*
          path: coverage
          merge-multiple: true
      - run: node packages/ci/src/lcov-cli.ts merge coverage/lcov.info coverage/unitarios.info coverage/integracao.info coverage/seguranca.info
      # Global só de unitários + integração: o de segurança traz tudo a 0% e corre sempre em todos os pacotes.
      - run: node packages/ci/src/lcov-cli.ts merge coverage/global.info coverage/unitarios.info coverage/integracao.info
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install diff-cover==10.0.0
      - run: diff-cover coverage/lcov.info --compare-branch=origin/main --fail-under=80 --json-report coverage/diff-cover.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cobertura
          path: |
            coverage/lcov.info
            coverage/global.info
            coverage/diff-cover.json
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: docker compose up -d --wait postgres
      - id: playwright
        run: echo "versao=$(pnpm --filter @scp/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      # Com cache só faltam as dependências do sistema.
      - run: pnpm --filter @scp/e2e exec playwright install --with-deps chromium webkit
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm --filter @scp/e2e exec playwright install-deps chromium webkit
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  tamanho-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm build
      - run: pnpm check:size

  relatorio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: cobertura
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: cobertura
          path: coverage
      - name: Diff do PR
        run: |
          mkdir -p coverage
          git diff --unified=0 origin/main...HEAD > coverage/pr.diff
      - run: node packages/ci/src/relatorio-cli.ts --lcov-global coverage/global.info --diff-cover coverage/diff-cover.json --diff coverage/pr.diff --saida coverage/relatorio.md
      - run: cat coverage/relatorio.md >> "$GITHUB_STEP_SUMMARY"
      # PRs de forks têm o token só de leitura: o comentário fica de fora.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          header: relatorio-ci
          path: coverage/relatorio.md
