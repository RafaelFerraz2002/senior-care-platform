pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,tsx,mjs,json,md,yml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,tsx,mjs}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
